name: GMI pricing evidence
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: harnesstwin-gmi-pricing
  cancel-in-progress: false
jobs:
  pricing:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record GMI price metadata and two bounded requests
        env:
          GMI_API_KEY: ${{ secrets.GMI_API_KEY }}
          GMI_ORGANIZATION_ID: ${{ vars.GMI_ORGANIZATION_ID }}
        run: python3 ci/verify_gmi_price.py
      - name: Publish the sanitized pricing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gmi-pricing-evidence-${{ github.run_id }}
          path: gmi-pricing-evidence.json
          retention-days: 14
