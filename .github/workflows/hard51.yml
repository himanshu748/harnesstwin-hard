name: HARD-51 benchmark
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution phase
        required: true
        default: controls
        type: choice
        options: [inventory, controls, smoke, triad, second, pilot, resume-pilot, controls-second, hard, hard-flash]
      first_task:
        description: First task in hard mode
        type: number
        default: 1
      task_count:
        description: Number of matched tasks in hard mode
        type: number
        default: 10
      trial:
        description: Hard-mode repeat number
        type: number
        default: 1
      phase_budget:
        description: Remaining hard-phase USD ceiling
        type: string
        default: '47.00'
permissions:
  contents: read
concurrency:
  group: harnesstwin-hard51
  cancel-in-progress: false
jobs:
  benchmark:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        first_task: ${{ fromJSON(inputs.mode == 'hard-flash' && '[1,7,13,19,25,31,37,43,49]' || '[0]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Fetch the pinned task definitions
        if: inputs.mode != 'inventory'
        run: |
          git init official
          git -C official remote add origin https://github.com/scaleapi/SWE-bench_Pro-os.git
          git -C official fetch --depth=1 origin 66f92766bba642462d4bbe5479e83f91f9211862
      - name: Run the selected phase
        env:
          GMI_API_KEY: ${{ secrets.GMI_API_KEY }}
          GMI_ORGANIZATION_ID: ${{ vars.GMI_ORGANIZATION_ID }}
          MODE: ${{ inputs.mode }}
          FIRST_TASK: ${{ inputs.first_task }}
          TASK_COUNT: ${{ inputs.task_count }}
          TRIAL: ${{ inputs.trial }}
          PHASE_BUDGET: ${{ inputs.phase_budget }}
          FLASH_FIRST_TASK: ${{ matrix.first_task }}
        run: |
          args=("$MODE" --dataset official --out run-evidence)
          if [ "$MODE" = hard ]; then
            args+=(--first-task "$FIRST_TASK" --task-count "$TASK_COUNT" --trial "$TRIAL" --phase-budget "$PHASE_BUDGET")
          elif [ "$MODE" = hard-flash ]; then
            flash_task_count=6
            if [ "$FLASH_FIRST_TASK" = 49 ]; then flash_task_count=3; fi
            args+=(--first-task "$FLASH_FIRST_TASK" --task-count "$flash_task_count" --trial "$TRIAL")
          fi
          python3 ci/run.py "${args[@]}"
      - name: Normalize evidence permissions
        if: always()
        run: |
          if [ -d run-evidence ]; then
            sudo find run-evidence -mindepth 1 ! -type d ! -type f -delete
            sudo find run-evidence -type f -exec chmod a+r {} +
            sudo find run-evidence -type d -exec chmod a+rx {} +
          fi
          for result in run-evidence/controls.json run-evidence/smoke.json run-evidence/inventory.json run-evidence/pricing.json run-evidence/budget.json run-evidence/results.json; do
            if [ -f "$result" ]; then
              echo "### $result" >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              cat "$result" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harnesstwin-${{ inputs.mode }}-${{ github.run_id }}-${{ matrix.first_task }}
          path: |
            run-evidence/**/results.*
            run-evidence/**/inventory.json
            run-evidence/**/pricing.json
            run-evidence/**/budget.json
            run-evidence/**/controls.json
            run-evidence/**/smoke.json
            run-evidence/**/plan.json
            run-evidence/**/agent.log
            run-evidence/**/build.log
            run-evidence/**/usage.jsonl
            run-evidence/**/agent/**
            run-evidence/**/verifier/**
          retention-days: 14
